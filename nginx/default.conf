# KMC-GIS-SERVER Nginx 1.30 Ingress, X-Accel-Redirect & 5-Layer Nepal Sovereign Geo-Gate
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=tiles_limit:10m rate=300r/s;

# High-Throughput Sub-millisecond Edge Cache for Vector Tiles (Martin) & Raster Tiles
proxy_cache_path /var/cache/nginx/mvt_cache levels=1:2 keys_zone=mvt_cache:64m max_size=4g inactive=24h use_temp_path=off;

# WebSocket / SSE Connection Upgrade Map (avoids hardcoded "upgrade" on plain HTTP/1.1)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Preserve the scheme seen by a TLS-terminating front (cloudflared tunnel,
# load balancer) so absolute links (OGC API, Location headers) stay https even
# though this hop is plain HTTP. Direct traffic falls back to the listener scheme.
map $http_x_forwarded_proto $kmc_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Preserve the external host seen by a TLS-terminating front (cloudflared tunnel,
# load balancer) so Auth.js / OGC links reflect the public origin.
map $http_x_forwarded_host $kmc_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

# Emit HSTS whenever the effective external scheme is HTTPS (direct TLS or tunnel).
# Empty value causes nginx to omit the header on plain HTTP listeners.
map $kmc_forwarded_proto $kmc_hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Docker Embedded DNS Resolver for Dynamic Upstream Resolution.
    # Upstreams MUST be referenced through variables below: a literal
    # `proxy_pass http://service:port` resolves only once at nginx startup and
    # keeps dead IPs after container recreation, producing 502/500 storms.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin    "http://backend:8000";
    set $frontend_origin   "http://frontend:3000";
    set $geoportal_origin  "http://geoportal:3000";
    set $martin_origin     "http://martin:3000";
    set $tileserver_origin "http://tileserver:8080";
    set $geoserver_origin  "http://geoserver:8080";

    include /etc/nginx/kmc-locations.inc;
}
