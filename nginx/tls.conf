# KMC-GIS-SERVER HTTPS listener (opt-in).
# Activated with: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Requires operator-provided certificates (e.g. Let's Encrypt) at:
#   /etc/nginx/ssl/fullchain.pem
#   /etc/nginx/ssl/privkey.pem
#
# Rate-limit zones (api_limit, auth_limit, upload_limit, tiles_limit) and
# the proxy cache (mvt_cache) are declared once in default.conf's http scope
# and shared by this listener.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is emitted via /etc/nginx/kmc-security-headers.inc ($kmc_hsts_header)
    # so child location blocks with add_header never drop it.

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin    "http://backend:8000";
    set $frontend_origin   "http://frontend:3000";
    set $geoportal_origin  "http://geoportal:3000";
    set $martin_origin     "http://martin:3000";
    set $tileserver_origin "http://tileserver:8080";
    set $geoserver_origin  "http://geoserver:8080";

    # The shared fragment references the HTTP zone names; tune here instead.
    include /etc/nginx/kmc-locations.inc;
}
