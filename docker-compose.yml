# ============================================================
# KMC-GIS-SERVER Docker Compose Stack (Golden Practice Configuration)
# Core Principles:
# 1. "Build Once, Run Anywhere" (12-Factor App):
#    - Zero environment variables or secrets are baked into Docker images.
# 2. Cold-Start Determinism & Swarm Secret Compatibility:
#    - Local `docker compose up --build` boots cleanly without pre-populated
#      `./secrets/*.txt` files using explicit local-dev defaults (override via
#      `.env` or mount `/run/secrets/*`).
#    - Production Swarm (`docker-compose.swarm.yml`) enforces Raft-encrypted
#      in-memory secrets with `ENFORCE_SWARM_SECRETS=true` and `mode: 0400`.
# 3. Self-Contained Build Definitions:
#    - Each service owns a single Dockerfile (`backend/Dockerfile`,
#      `frontend/Dockerfile`, `geoportal/Dockerfile`).
# 4. ONE Public Origin (Golden Port Rule):
#    - Only nginx publishes host ports (HOST_PORT/HOST_SSL_PORT).
#    - frontend, geoportal, backend and postgres are internal (`expose:`).
#    - Need direct access while debugging? Use docker-compose.dev.yml, which
#      binds loopback-only ports. Canonical URLs never change:
#        /            -> frontend
#        /geoportal   -> geoportal
#        /api, /tiles, /martin, /geoserver -> their services
# ============================================================

name: kmc-gis-server

services:
  # ============================================================
  # 1. PostgreSQL 16 + PostGIS 3.4 — Central Enterprise Geodatabase
  # ============================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kmc_server_postgres
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmc_gis}
      POSTGRES_USER: ${POSTGRES_USER:-kmc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kmc_dev_postgres_password}
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kmc_user} -d $${POSTGRES_DB:-kmc_gis}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ============================================================
  # 1b. PgBouncer — Lightweight Connection Pooler (1,000+ Concurrent Queries)
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: kmc_server_pgbouncer
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "5432"
      - "6432"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-kmc_gis}
      DB_USER: ${POSTGRES_USER:-kmc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kmc_dev_postgres_password}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "20"
      MAX_DB_CONNECTIONS: "250"
      SERVER_IDLE_TIMEOUT: "300"
      CLIENT_IDLE_TIMEOUT: "300"
      MAX_PREPARED_STATEMENTS: "100"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /run/secrets/kmc_postgres_password ]; then
          export DB_PASSWORD="$$(tr -d '\r\n' < /run/secrets/kmc_postgres_password)"
        else
          export DB_PASSWORD="$${POSTGRES_PASSWORD:-kmc_dev_postgres_password}"
        fi
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER:-kmc_user} -d $${DB_NAME:-kmc_gis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # 2. Redis 7.4 — Binary MVT PBF Cache, Task Locks & Geo-IP Cache
  # ============================================================
  redis:
    image: redis:7.4-alpine
    container_name: kmc_server_redis
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kmc_dev_redis_password}
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /run/secrets/kmc_redis_password ]; then
          REDIS_PASS="$$(tr -d '\r\n' < /run/secrets/kmc_redis_password)"
        else
          REDIS_PASS="$${REDIS_PASSWORD:-kmc_dev_redis_password}"
        fi
        exec redis-server --requirepass "$$REDIS_PASS" --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD-SHELL", "REDIS_PASS=\"$$([ -f /run/secrets/kmc_redis_password ] && tr -d '\\r\\n' < /run/secrets/kmc_redis_password || printf '%s' \"$${REDIS_PASSWORD:-kmc_dev_redis_password}\")\"; redis-cli -a \"$$REDIS_PASS\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # 3. FastAPI Backend — PostGIS REST API, native MBTiles tile engine,
  #    6-mode spatial grid generator, split/merge/link edit suite & delta sync
  #    Runs as non-root kmcuser (UID 10001, GID 10001).
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kmc-gis/backend:${IMAGE_TAG:-latest}
    container_name: kmc_server_backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${UVICORN_WORKERS:-2}"]
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME:-KMC-GIS-SERVER}
      APP_ENV: ${APP_ENV:-production}
      ENFORCE_SWARM_SECRETS: ${ENFORCE_SWARM_SECRETS:-false}
      SECRET_VERSION: ${SECRET_VERSION:-v1}
      POSTGRES_DB: ${POSTGRES_DB:-kmc_gis}
      POSTGRES_USER: ${POSTGRES_USER:-kmc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kmc_dev_postgres_password}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-/run/secrets/kmc_postgres_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-pgbouncer}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kmc_dev_redis_password}
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-/run/secrets/kmc_redis_password}
      SECRET_KEY: ${SECRET_KEY:-kmc_dev_jwt_secret_key_change_in_production_2083}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-/run/secrets/kmc_jwt_secret_key}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-KmcSuperAdmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kmc.gov.np}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-KmcSuperAdmin@2083}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-/run/secrets/kmc_admin_password}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      MASTER_ADMIN_USERNAME: ${MASTER_ADMIN_USERNAME:-KmcMasterAdmin}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL:-master@kmc.gov.np}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-KmcMasterAdmin@2083}
      MASTER_ADMIN_PASSWORD_FILE: ${MASTER_ADMIN_PASSWORD_FILE:-/run/secrets/kmc_master_admin_password}
      MASTER_ADMIN_FULL_NAME: ${MASTER_ADMIN_FULL_NAME:-}
      TILESERVER_INTERNAL_URL: ${TILESERVER_INTERNAL_URL:-http://tileserver:8080}
      MARTIN_INTERNAL_URL: ${MARTIN_INTERNAL_URL:-http://martin:3000}
      GEOSERVER_INTERNAL_URL: ${GEOSERVER_INTERNAL_URL:-http://geoserver:8080/geoserver}
      PUBLIC_API_URL: ${API_URL:-/api}
      PUBLIC_TILE_URL: ${TILE_URL:-/tiles}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1048576}
      # API docs stay off in production unless ENABLE_API_DOCS=true is set.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Empty means browsers may only call this origin (same-origin Next.js proxy).
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # 5-Layer Nepal Geo-Gate: enforce | monitor | off
      GEO_GATE_MODE: ${GEO_GATE_MODE:-monitor}
      GEOIP_COUNTRY_DB: ${GEOIP_COUNTRY_DB:-/app/geoip/GeoLite2-Country.mmdb}
      GEOIP_ASN_DB: ${GEOIP_ASN_DB:-/app/geoip/GeoLite2-ASN.mmdb}
      GEOIP_BLOCKED_ASNS: ${GEOIP_BLOCKED_ASNS:-}
      TMPDIR: /tileserver-data/temp
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/app:/app/app
      - ./data/tileserver:/tileserver-data
      - ./data/uploads:/app/uploads
      - ./data/geoip:/app/geoip:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s

  # ============================================================
  # 4. Martin — Rust PostGIS MVT Vector Tile & PMTiles Server
  # ============================================================
  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    container_name: kmc_server_martin
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmc_gis}
      POSTGRES_USER: ${POSTGRES_USER:-kmc_user}
      POSTGRES_HOST: ${MARTIN_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kmc_dev_postgres_password}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /run/secrets/kmc_postgres_password ]; then
          PG_PASS="$$(tr -d '\r\n' < /run/secrets/kmc_postgres_password)"
        else
          PG_PASS="$${POSTGRES_PASSWORD:-kmc_dev_postgres_password}"
        fi
        cat <<EOF > /tmp/martin.yaml
        keep_alive: 75
        worker_processes: 4
        cache_size_mb: 1024
        postgres:
          connection_string: "postgresql://$${POSTGRES_USER:-kmc_user}:$${PG_PASS}@$${POSTGRES_HOST:-pgbouncer}:$${POSTGRES_PORT:-5432}/$${POSTGRES_DB:-kmc_gis}"
          pool_size: 50
          auto_bounds: quick
          auto_publish:
            tables:
              from_schemas:
                - "public"
        EOF
        exec martin -c /tmp/martin.yaml
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================
  # 5. TileServer-GL — High-Res KMC UAV Orthophoto MBTiles Server
  #    Secret Grant: NONE (Least-Privilege Isolation)
  # ============================================================
  tileserver:
    image: maptiler/tileserver-gl:v5.7.0
    container_name: kmc_server_tileserver
    restart: unless-stopped
    volumes:
      - ./data/tileserver:/data
    # Backend writes /data/config.json during startup; waiting for it prevents
    # tileserver-gl from booting empty and downloading its Zurich demo dataset.
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================
  # 6. GeoServer — Enterprise OGC WMS / WFS-T / WMTS / WCS Server
  # ============================================================
  geoserver:
    image: docker.osgeo.org/geoserver:2.25.4
    container_name: kmc_server_geoserver
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-KmcGeoServer@2083}
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -f /run/secrets/kmc_geoserver_admin_password ]; then
          export GEOSERVER_ADMIN_PASSWORD="$$(tr -d '\r\n' < /run/secrets/kmc_geoserver_admin_password)"
        else
          export GEOSERVER_ADMIN_PASSWORD="$${GEOSERVER_ADMIN_PASSWORD:-KmcGeoServer@2083}"
        fi
        exec bash /opt/startup.sh
    volumes:
      - geoserver_data:/opt/geoserver_data
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/geoserver/web/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/geoserver/web/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  # ============================================================
  # 7. Next.js 15 Field PWA & Admin Console
  #    Build: oven/bun:1.4.4-alpine -> Runtime: node:22.23.4-alpine
  #    Secret Grant: NONE (Least-Privilege Isolation)
  #    Golden port rule: no host port — reachable only through nginx (:80/:443).
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kmc-gis/frontend:${IMAGE_TAG:-latest}
    container_name: kmc_server_frontend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "3000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      API_URL: ${API_URL:-/api}
      TILE_URL: ${TILE_URL:-/tiles}
      GEOPORTAL_URL: ${GEOPORTAL_URL:-/geoportal}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      TILESERVER_INTERNAL_URL: ${TILESERVER_INTERNAL_URL:-http://tileserver:8080}
      GEOPORTAL_INTERNAL_URL: ${GEOPORTAL_INTERNAL_URL:-http://geoportal:3000}
      MARTIN_INTERNAL_URL: ${MARTIN_INTERNAL_URL:-http://martin:3000}
      GEOSERVER_INTERNAL_URL: ${GEOSERVER_INTERNAL_URL:-http://geoserver:8080/geoserver}
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ============================================================
  # 8. Next.js 15 Public GeoPortal
  #    Build: oven/bun:1.4.4-alpine -> Runtime: node:22.23.4-alpine
  #    Secret Grant: NONE (Least-Privilege Isolation)
  #    Golden port rule: no host port — served at /geoportal via nginx.
  # ============================================================
  geoportal:
    build:
      context: ./geoportal
      dockerfile: Dockerfile
    image: kmc-gis/geoportal:${IMAGE_TAG:-latest}
    container_name: kmc_server_geoportal
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "3000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      API_URL: ${API_URL:-/api}
      TILE_URL: ${TILE_URL:-/tiles}
      GEOPORTAL_URL: ${GEOPORTAL_URL:-/geoportal}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      TILESERVER_INTERNAL_URL: ${TILESERVER_INTERNAL_URL:-http://tileserver:8080}
      MARTIN_INTERNAL_URL: ${MARTIN_INTERNAL_URL:-http://martin:3000}
      GEOSERVER_INTERNAL_URL: ${GEOSERVER_INTERNAL_URL:-http://geoserver:8080/geoserver}
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/geoportal').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ============================================================
  # 9. Nginx 1.30 — Reverse Proxy, X-Accel-Redirect & 5-Layer Nepal Geo-Gate
  # ============================================================
  nginx:
    image: nginx:1.30.7-alpine
    container_name: kmc_server_nginx
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.inc:/etc/nginx/kmc-locations.inc:ro
      - ./nginx/security-headers.inc:/etc/nginx/kmc-security-headers.inc:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./data/uploads:/var/kmc_uploads:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      geoportal:
        condition: service_healthy
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      tileserver:
        condition: service_healthy
      martin:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: kmc_gis_server_postgres_data
  redis_data:
    name: kmc_gis_server_redis_data
  geoserver_data:
    name: kmc_gis_server_geoserver_data

networks:
  kmc_net:
    driver: bridge
