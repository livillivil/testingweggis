apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kmc-gis
  labels:
    app.kubernetes.io/name: kmc-gis-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kmc-gis-platform
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kmc-gis-platform
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: backend
          image: kmc-gis/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "4"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: kmc-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kmc-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kmc-secrets
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kmc-secrets
                  key: SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kmc-secrets
                  key: ADMIN_PASSWORD
            - name: MASTER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kmc-secrets
                  key: MASTER_ADMIN_PASSWORD
            - name: TMPDIR
              value: /tileserver-data/temp
            - name: UPLOAD_DIR
              value: /app/uploads
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: tileserver-storage
              mountPath: /tileserver-data
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: tileserver-storage
          persistentVolumeClaim:
            claimName: tileserver-pvc
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kmc-gis
  labels:
    app.kubernetes.io/name: kmc-gis-platform
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: kmc-gis-platform
    app.kubernetes.io/component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: kmc-gis
  labels:
    app.kubernetes.io/name: kmc-gis-platform
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: kmc-gis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kmc-gis-platform
      app.kubernetes.io/component: backend
