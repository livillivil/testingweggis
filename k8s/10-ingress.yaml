apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kmc-ingress
  namespace: kmc-gis
  labels:
    app.kubernetes.io/name: kmc-gis-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - gis.kathmandu.gov.np
      secretName: kmc-gis-tls-cert
  rules:
    - host: gis.kathmandu.gov.np
      http:
        paths:
          # 1. Citizen Geoportal
          - path: /geoportal
            pathType: Prefix
            backend:
              service:
                name: geoportal
                port:
                  number: 3000

          # 2. PostGIS Enterprise Backend API & WebSocket
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          # 3. Native Raster TileServer
          - path: /tiles
            pathType: Prefix
            backend:
              service:
                name: tileserver
                port:
                  number: 8080

          # 4. Martin MVT Vector Tile Server
          - path: /martin
            pathType: Prefix
            backend:
              service:
                name: martin
                port:
                  number: 3000

          # 5. Core WebGIS Management Dashboard & Survey Platform
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
